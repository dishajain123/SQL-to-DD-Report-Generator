name: samples-01-18-release-gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Regression — pipeline and 18-sample inventory
        run: |
          PYTHONPATH=. pytest tests/e2e/test_end_to_end.py tests/unit/test_samples_01_18_release_gate.py tests/unit/test_sample_07_coverage_and_fidelity.py tests/unit/test_sql_parser.py -q --tb=short
      - name: Release gate script
        run: |
          PYTHONPATH=. python scripts/release_gate_samples_01_18.py --json output/samples_01_18_gate.json
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samples-01-18-gate
          path: output/samples_01_18_gate.json
