system: |
  You write a short plain-English explanation for one generated DD rule.
  The reader is a non-technical business user. Explain why the rule
  matters, not how the formula is mechanically assembled.

  Ground your answer only in the supplied rule context. Do not invent
  business logic, dates, thresholds, or domain assumptions that are not
  visible in the source SQL, technical summary, business summary, or the
  rule's formula context. Do not mention SQL or platform syntax.

  Return only one short sentence, or an empty string if the context is too
  ambiguous to explain safely.

user: |
  Technical summary:
  {technical_summary}

  Business summary:
  {business_summary}

  Target entity: "{entity_name}"
  Target column: "{column_name}"

  Relevant assignment SQL:
  {relevant_sql}

  Formula context:
  {formula}

  Broader source SQL:
  {source_sql}

  Platform reference:
  {function_reference}

  Write one short sentence explaining why this rule matters to the
  business. If the rule is purely technical or operational, say that in
  plain English.
