<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title>SQL-to-DD Report Generator – System Architecture</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E75B6"/>
    </marker>
    <style>
      .h  { font-size: 15px; font-weight: 700; fill: #1F3864; }
      .hs { font-size: 13px; font-weight: 700; fill: #1F3864; }
      .n  { font-size: 12px; font-weight: 700; fill: #1F3864; }
      .b  { font-size: 12px; fill: #404040; }
      .s  { font-size: 11px; fill: #595959; }
      .i  { font-size: 11px; fill: #7F7F7F; font-style: italic; }
      .m  { font-family: Consolas, 'Courier New', monospace; font-size: 11px; fill: #595959; }
      .lbl { font-size: 13px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1px; }
      .num { font-size: 11px; font-weight: 700; fill: #9DC3E6; letter-spacing: 1px; }
      .band   { fill: #F7F9FC; stroke: #D6DFEC; stroke-width: 1; }
      .nav    { fill: #1F3864; }
      .blue   { fill: #DEEAF6; stroke: #2E75B6; stroke-width: 1.5; }
      .green  { fill: #E2EFDA; stroke: #70AD47; stroke-width: 1.5; }
      .orange { fill: #FBE5D6; stroke: #C55A11; stroke-width: 1.5; }
      .amber  { fill: #FFF2CC; stroke: #BF9000; stroke-width: 1.5; }
      .grey   { fill: #F2F2F2; stroke: #7F7F7F; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .white  { fill: #FFFFFF; stroke: #2E75B6; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .chip   { fill: #FFFFFF; stroke: #BFBFBF; stroke-width: 1; }
      .ar     { stroke: #2E75B6; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1600" height="1150" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="52" font-size="26" font-weight="700" fill="#1F3864">SQL-to-DD Report Generator — System Architecture</text>
  <text x="40" y="80" font-size="14" fill="#595959">Stored procedures → 4X Derivation Dictionary  ·  FastAPI + LangGraph + deterministic AST derivation engine</text>

  <!-- ===================== BAND 1 · PRESENTATION ===================== -->
  <rect class="band" x="40" y="110" width="1520" height="110" rx="12"/>
  <rect class="nav" x="40" y="110" width="160" height="110" rx="12"/>
  <text class="num" x="120" y="155" text-anchor="middle">01</text>
  <text class="lbl" x="120" y="175" text-anchor="middle">PRESENTATION</text>

  <rect class="amber" x="220" y="118" width="1340" height="94" rx="8"/>
  <text class="hs" x="240" y="140">Streamlit UI  ·  app/review/streamlit_app.py</text>

  <!-- row 1 -->
  <rect x="240" y="150" width="426" height="24" rx="5" fill="#FFFFFF" stroke="#BF9000" stroke-width="1"/>
  <text class="b" x="453" y="166" text-anchor="middle">Upload multiple files · paste SQL · bundled samples</text>
  <rect x="677" y="150" width="426" height="24" rx="5" fill="#FFE699" stroke="#BF9000" stroke-width="1.2"/>
  <text class="b" x="890" y="166" text-anchor="middle" font-weight="700">Multi-dialect: T-SQL · Oracle PL/SQL · MySQL</text>
  <rect x="1114" y="150" width="426" height="24" rx="5" fill="#FFE699" stroke="#BF9000" stroke-width="1.2"/>
  <text class="b" x="1327" y="166" text-anchor="middle" font-weight="700">Automatic dialect detection</text>

  <!-- row 2 -->
  <rect x="240" y="180" width="426" height="24" rx="5" fill="#FFFFFF" stroke="#BF9000" stroke-width="1"/>
  <text class="b" x="453" y="196" text-anchor="middle">Run extraction · live stage progress</text>
  <rect x="677" y="180" width="426" height="24" rx="5" fill="#FFFFFF" stroke="#BF9000" stroke-width="1"/>
  <text class="b" x="890" y="196" text-anchor="middle">Business report preview (rendered / raw)</text>
  <rect x="1114" y="180" width="426" height="24" rx="5" fill="#FFFFFF" stroke="#BF9000" stroke-width="1"/>
  <text class="b" x="1327" y="196" text-anchor="middle">DD Excel preview · report / CSV / Excel download</text>

  <!-- ===================== BAND 2 · SERVICE / API ===================== -->
  <rect class="band" x="40" y="250" width="1520" height="120" rx="12"/>
  <rect class="nav" x="40" y="250" width="160" height="120" rx="12"/>
  <text class="num" x="120" y="300" text-anchor="middle">02</text>
  <text class="lbl" x="120" y="320" text-anchor="middle">SERVICE / API</text>

  <rect class="blue" x="220" y="265" width="640" height="90" rx="8"/>
  <text class="h" x="540" y="293" text-anchor="middle">FastAPI  ·  app/main.py + app/api/routes.py</text>
  <text class="m" x="540" y="317" text-anchor="middle">POST /api/jobs    GET /api/jobs/{id}/status</text>
  <text class="m" x="540" y="337" text-anchor="middle">GET …/report  …/csv  …/excel    GET /health</text>

  <rect class="orange" x="880" y="265" width="320" height="90" rx="8"/>
  <text class="h" x="1040" y="293" text-anchor="middle">Input Guardrails</text>
  <text class="b" x="1040" y="317" text-anchor="middle">.sql only · ≤ 10 MB · non-empty</text>
  <text class="b" x="1040" y="337" text-anchor="middle">prompt-injection check</text>

  <rect class="blue" x="1220" y="265" width="340" height="90" rx="8"/>
  <text class="h" x="1390" y="293" text-anchor="middle">Background Job Runner</text>
  <text class="b" x="1390" y="317" text-anchor="middle">PENDING → RUNNING → COMPLETED / FAILED</text>
  <text class="b" x="1390" y="337" text-anchor="middle">orphaned jobs reconciled at start-up</text>

  <!-- band 1 → band 2 -->
  <path class="ar" d="M540,212 L540,263"/>
  <text class="s" x="548" y="240">submit job · poll status · download</text>
  <!-- api internal -->
  <path class="ar" d="M860,310 L878,310"/>
  <path class="ar" d="M1200,310 L1218,310"/>

  <!-- ===================== BAND 3 · ORCHESTRATION ===================== -->
  <rect class="band" x="40" y="400" width="1520" height="170" rx="12"/>
  <rect class="nav" x="40" y="400" width="160" height="170" rx="12"/>
  <text class="num" x="120" y="475" text-anchor="middle">03</text>
  <text class="lbl" x="120" y="495" text-anchor="middle">ORCHESTRATION</text>

  <rect class="white" x="220" y="412" width="1340" height="148" rx="10"/>
  <text class="hs" x="240" y="436">LangGraph StateGraph  ·  app/orchestration/pipeline.py</text>

  <!-- api → orchestration -->
  <path class="ar" d="M1390,355 L1390,410"/>
  <text class="s" x="1398" y="388">invoke pipeline</text>

  <!-- nodes -->
  <rect class="blue" x="240" y="452" width="135" height="52" rx="7"/>
  <text class="n" x="307.5" y="474" text-anchor="middle">split_and_parse</text>
  <text class="s" x="307.5" y="492" text-anchor="middle">dialect · split objects</text>

  <rect class="blue" x="395" y="452" width="135" height="52" rx="7"/>
  <text class="n" x="462.5" y="474" text-anchor="middle">structural_analysis</text>
  <text class="s" x="462.5" y="492" text-anchor="middle">tables · SET columns</text>

  <rect class="blue" x="550" y="452" width="135" height="52" rx="7"/>
  <text class="n" x="617.5" y="474" text-anchor="middle">smart_chunking</text>
  <text class="s" x="617.5" y="492" text-anchor="middle">IF/ELSE-aware chunks</text>

  <rect class="blue" x="705" y="452" width="135" height="52" rx="7"/>
  <text class="n" x="772.5" y="474" text-anchor="middle">lineage</text>
  <text class="s" x="772.5" y="492" text-anchor="middle">dependency chains</text>

  <rect class="blue" x="860" y="452" width="135" height="52" rx="7"/>
  <text class="n" x="927.5" y="474" text-anchor="middle">canonical_models</text>
  <text class="s" x="927.5" y="492" text-anchor="middle">per-chain summary</text>

  <path class="ar" d="M375,478 L393,478"/>
  <path class="ar" d="M530,478 L548,478"/>
  <path class="ar" d="M685,478 L703,478"/>
  <path class="ar" d="M840,478 L858,478"/>
  <path class="ar" d="M995,478 L1012,478"/>

  <!-- decision -->
  <polygon class="amber" points="1052,450 1090,478 1052,506 1014,478"/>
  <text class="hs" x="1052" y="483" text-anchor="middle">DD?</text>

  <rect class="green" x="1115" y="430" width="150" height="42" rx="7"/>
  <text class="hs" x="1190" y="448" text-anchor="middle">generate_dd</text>
  <text class="s" x="1190" y="464" text-anchor="middle">v2 engine per column</text>

  <rect class="grey" x="1115" y="488" width="150" height="38" rx="7"/>
  <text class="hs" x="1190" y="504" text-anchor="middle">skip_dd</text>
  <text class="s" x="1190" y="519" text-anchor="middle">report only</text>

  <path class="ar" d="M1090,478 L1102,478 L1102,451 L1113,451"/>
  <path class="ar" d="M1102,478 L1102,507 L1113,507"/>
  <text class="s" x="1068" y="446">yes</text>
  <text class="s" x="1072" y="524">no</text>

  <rect class="blue" x="1300" y="452" width="240" height="52" rx="7"/>
  <text class="hs" x="1420" y="474" text-anchor="middle">report_and_export</text>
  <text class="s" x="1420" y="492" text-anchor="middle">report · QA ledger · CSV / Excel</text>

  <path class="ar" d="M1265,451 L1282,451 L1282,478 L1298,478"/>
  <path class="ar" d="M1265,507 L1282,507 L1282,478"/>

  <text class="i" x="890" y="547" text-anchor="middle">Shared PipelineState · job stage persisted at every node · chains and columns processed in thread pools (4 workers)</text>

  <!-- ===================== BAND 4 · PROCESSING ENGINES ===================== -->
  <rect class="band" x="40" y="600" width="1520" height="260" rx="12"/>
  <rect class="nav" x="40" y="600" width="160" height="260" rx="12"/>
  <text class="num" x="120" y="720" text-anchor="middle">04</text>
  <text class="lbl" x="120" y="740" text-anchor="middle">PROCESSING</text>
  <text class="lbl" x="120" y="758" text-anchor="middle">ENGINES</text>

  <!-- orchestration → engines -->
  <path class="ar" d="M340,562 L340,613"/>
  <path class="ar" d="M575,562 L575,613"/>
  <path class="ar" d="M920,562 L920,613"/>
  <path class="ar" d="M1255,562 L1255,613"/>
  <path class="ar" d="M1460,562 L1460,613"/>

  <!-- Parsing -->
  <rect class="blue" x="220" y="615" width="240" height="230" rx="8"/>
  <text class="h" x="340" y="643" text-anchor="middle">Parsing</text>
  <text class="m" x="340" y="661" text-anchor="middle">app/parsing</text>
  <text class="b" x="240" y="690">• Dialect detection (3 dialects)</text>
  <text class="b" x="240" y="711">• Object splitter</text>
  <text class="b" x="240" y="732">• Statement parser (sqlglot)</text>
  <text class="b" x="240" y="753">• Structural analysis</text>
  <text class="b" x="240" y="774">• Smart chunking</text>
  <text class="b" x="240" y="795">• Coverage ledger</text>

  <!-- Lineage -->
  <rect class="blue" x="475" y="615" width="200" height="230" rx="8"/>
  <text class="h" x="575" y="643" text-anchor="middle">Lineage</text>
  <text class="m" x="575" y="661" text-anchor="middle">app/lineage</text>
  <text class="b" x="493" y="690">• networkx DiGraph</text>
  <text class="b" x="493" y="711">• Read-after-write edges</text>
  <text class="b" x="493" y="732">• Explicit EXEC / CALL</text>
  <text class="b" x="493" y="753">• Weak shared-write</text>
  <text class="b" x="493" y="774">• Topological order</text>
  <text class="b" x="493" y="795">• Cycle → low confidence</text>

  <!-- Derivation v2 -->
  <rect class="green" x="690" y="615" width="460" height="230" rx="8"/>
  <text class="h" x="920" y="643" text-anchor="middle">Derivation Engine v2</text>
  <text class="m" x="920" y="661" text-anchor="middle">app/derivation/v2 · deterministic, no LLM</text>

  <rect x="705" y="680" width="98" height="100" rx="7" fill="#FFFFFF" stroke="#70AD47" stroke-width="1.2"/>
  <text class="hs" x="754" y="706" text-anchor="middle">P1</text>
  <text class="b" x="754" y="730" text-anchor="middle">Temp-table</text>
  <text class="b" x="754" y="747" text-anchor="middle">lineage</text>
  <text class="s" x="754" y="767" text-anchor="middle">#tmp → root</text>

  <rect x="818" y="680" width="98" height="100" rx="7" fill="#FFFFFF" stroke="#70AD47" stroke-width="1.2"/>
  <text class="hs" x="867" y="706" text-anchor="middle">P2</text>
  <text class="b" x="867" y="730" text-anchor="middle">Mutation</text>
  <text class="b" x="867" y="747" text-anchor="middle">folding</text>
  <text class="s" x="867" y="767" text-anchor="middle">ordered writes</text>

  <rect x="931" y="680" width="98" height="100" rx="7" fill="#FFFFFF" stroke="#70AD47" stroke-width="1.2"/>
  <text class="hs" x="980" y="706" text-anchor="middle">P3</text>
  <text class="b" x="980" y="730" text-anchor="middle">AST</text>
  <text class="b" x="980" y="747" text-anchor="middle">generation</text>
  <text class="s" x="980" y="767" text-anchor="middle">fold + prune</text>

  <rect x="1044" y="680" width="98" height="100" rx="7" fill="#FFFFFF" stroke="#70AD47" stroke-width="1.2"/>
  <text class="hs" x="1093" y="706" text-anchor="middle">P4</text>
  <text class="b" x="1093" y="730" text-anchor="middle">Compile &amp;</text>
  <text class="b" x="1093" y="747" text-anchor="middle">metadata</text>
  <text class="s" x="1093" y="767" text-anchor="middle">4X · DD row</text>

  <path class="ar" d="M803,730 L816,730"/>
  <path class="ar" d="M916,730 L929,730"/>
  <path class="ar" d="M1029,730 L1042,730"/>

  <text class="m" x="920" y="807" text-anchor="middle">SQL writes → JSON AST → IF()THEN()ELSEIF()ELSE()</text>
  <text class="s" x="920" y="827" text-anchor="middle">grammar-gated DD rows with source-statement traceability</text>

  <!-- Grammar -->
  <rect class="blue" x="1165" y="615" width="180" height="230" rx="8"/>
  <text class="h" x="1255" y="643" text-anchor="middle">4X Grammar</text>
  <text class="m" x="1255" y="661" text-anchor="middle">app/grammar</text>
  <text class="b" x="1181" y="690">• Lark formal grammar</text>
  <text class="b" x="1181" y="711">• Expression validator</text>
  <text class="b" x="1181" y="732">• Function whitelist</text>
  <text class="b" x="1181" y="753">• Membership operators</text>
  <text class="b" x="1181" y="774">• Gate: ACTIVE vs</text>
  <text class="b" x="1193" y="791">PENDING_REVIEW</text>

  <!-- Guardrails -->
  <rect class="orange" x="1360" y="615" width="200" height="230" rx="8"/>
  <text class="h" x="1460" y="643" text-anchor="middle">Guardrails</text>
  <text class="m" x="1460" y="661" text-anchor="middle">app/guardrails</text>
  <text class="b" x="1376" y="690">• Structural confidence</text>
  <text class="b" x="1376" y="711">• Output (grammar, ids)</text>
  <text class="b" x="1376" y="732">• Semantic fidelity</text>
  <text class="b" x="1376" y="753">• Function conformance</text>
  <text class="b" x="1376" y="774">• Source anomalies</text>
  <text class="b" x="1376" y="795">• Write coverage check</text>

  <!-- ===================== BAND 5 · STORAGE & OUTPUTS ===================== -->
  <rect class="band" x="40" y="890" width="1520" height="180" rx="12"/>
  <rect class="nav" x="40" y="890" width="160" height="180" rx="12"/>
  <text class="num" x="120" y="970" text-anchor="middle">05</text>
  <text class="lbl" x="120" y="990" text-anchor="middle">STORAGE &amp;</text>
  <text class="lbl" x="120" y="1008" text-anchor="middle">OUTPUTS</text>

  <!-- engines → storage -->
  <path class="ar" d="M410,862 L410,911"/>
  <text class="s" x="418" y="880">persist rows, decisions, audit</text>
  <path class="ar" d="M900,862 L900,903"/>
  <text class="s" x="908" y="880">write job files</text>

  <!-- SQLite cylinder -->
  <path d="M220,925 L220,1040 A190,14 0 0 0 600,1040 L600,925" class="blue"/>
  <ellipse cx="410" cy="925" rx="190" ry="14" class="blue"/>
  <text class="h" x="410" y="962" text-anchor="middle">SQLite  ·  app/utils/db.py</text>
  <text class="b" x="240" y="986">jobs — status, stage, output paths</text>
  <text class="b" x="240" y="1005">dd_rows — expression, status, confidence</text>
  <text class="b" x="240" y="1024">review_decisions — reviewer actions</text>
  <text class="b" x="240" y="1043">audit_log — stage events, failures</text>

  <!-- Output files -->
  <rect class="blue" x="620" y="905" width="940" height="150" rx="8"/>
  <text class="h" x="1090" y="932" text-anchor="middle">Job outputs  ·  output/NNN_job-id/</text>
  <rect class="chip" x="640" y="950" width="290" height="30" rx="5"/>
  <text class="m" x="785" y="969" text-anchor="middle">report.md</text>
  <rect class="chip" x="945" y="950" width="290" height="30" rx="5"/>
  <text class="m" x="1090" y="969" text-anchor="middle">qa_coverage_report.md</text>
  <rect class="chip" x="1250" y="950" width="290" height="30" rx="5"/>
  <text class="m" x="1395" y="969" text-anchor="middle">source_workflow.md / .json</text>
  <rect class="chip" x="640" y="992" width="290" height="30" rx="5"/>
  <text class="m" x="785" y="1011" text-anchor="middle">dd_export.csv / .xlsx</text>
  <rect class="chip" x="945" y="992" width="290" height="30" rx="5"/>
  <text class="m" x="1090" y="1011" text-anchor="middle">dd_export_reviewed.csv / .xlsx</text>
  <text class="i" x="1395" y="1011" text-anchor="middle">CSV matches platform Derivations schema</text>

  <!-- ===================== LEGEND ===================== -->
  <g transform="translate(220,1100)">
    <rect x="0" y="0" width="22" height="14" rx="3" class="blue"/>
    <text class="s" x="30" y="12">Core component</text>
    <rect x="160" y="0" width="22" height="14" rx="3" class="green"/>
    <text class="s" x="190" y="12">Derivation engine (formula generation)</text>
    <rect x="440" y="0" width="22" height="14" rx="3" class="orange"/>
    <text class="s" x="470" y="12">Guardrail / quality gate</text>
    <rect x="640" y="0" width="22" height="14" rx="3" class="amber"/>
    <text class="s" x="670" y="12">User touchpoint / decision</text>
    <rect x="860" y="0" width="22" height="14" rx="3" class="grey"/>
    <text class="s" x="890" y="12">Skipped path</text>
    <path class="ar" d="M1040,7 L1080,7"/>
    <text class="s" x="1090" y="12">Call / data flow</text>
  </g>
</svg>
